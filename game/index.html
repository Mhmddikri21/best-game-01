<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windward Post — a mail run against the wind</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a2c3a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Windward Post: sail the mail-boat between island harbors, deliver crates to the harbor with the matching letter before sunset"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { boot } from './src/main.js';
  boot(document.getElementById('game'));
</script>
</body>
</html>
